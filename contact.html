  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="./index.html">Local Cafe</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
          <span class="navbar-toggler-icon"></span>

  <section id="contact-form" class="py-1">
    <div class="container">
      <h1><span class="text-primary">Contact</span> Us</h1>

      <form>
        <div class="input-group mb-2">
          <label>Name</label>
          <input type="text" class="form-control">
        </div>

        <div class="input-group mb-2">
          <label>Email</label>
          <input type="email" class="form-control">
        </div>

        <div class="input-group mb-2">
          <label>Message</label>
          <textarea class="form-control"></textarea>
        </div>

        <button class="btn btn-primary">Submit</button>
      </form>
    </div>
  </section>

  <section id="features" class="text-center bg-dark text-white py-3">
    <div class="container">
      <div class="card p-3">
        <i class="fas fa-hotel fa-3x"></i>
        <h3>Location</h3>
        <p>1313 Mocking Bird Lane</p>
      </div>

      <div class="card p-3 mt-3">
        <i class="fas fa-phone fa-3x"></i>
        <h3>Phone Number</h3>
        <p>0000-1356</p>
      </div>

      <div class="card p-3 mt-3">
        <i class="fas fa-envelope fa-3x"></i>
        <h3>Email Address</h3>
        <p>helpdesk.com.au/localcafehelp</p>
